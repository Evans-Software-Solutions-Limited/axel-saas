<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef5e41" />

    <!-- Default title and description (overridden per page by PageMeta component) -->
    <title>Axel — AI Personal Assistant for Everyone</title>
    <meta
      name="description"
      content="Axel handles your calendar, comms, and tasks — built for anyone, not just developers. One assistant for every kind of work."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axel" />
    <meta
      property="og:title"
      content="Axel — AI Personal Assistant for Everyone"
    />
    <meta
      property="og:description"
      content="Axel handles your calendar, comms, and tasks — built for anyone, not just developers. One assistant for every kind of work."
    />
    <meta property="og:url" content="https://meetaxel.ai/" />
    <meta property="og:image" content="https://meetaxel.ai/pwa-icon.png" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Axel — AI Personal Assistant for Everyone"
    />
    <meta
      name="twitter:description"
      content="Axel handles your calendar, comms, and tasks — built for anyone, not just developers."
    />
    <meta name="twitter:image" content="https://meetaxel.ai/pwa-icon.png" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Axel" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />

    <!-- Organisation structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Axel",
        "url": "https://meetaxel.ai",
        "description": "AI personal assistant for everyone — calendar, comms, and tasks in one place.",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "admin@evans-software-solutions.com",
          "contactType": "customer support"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
