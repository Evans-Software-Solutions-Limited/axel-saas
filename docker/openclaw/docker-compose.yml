services:
  openclaw:
    build:
      context: .
      args:
        # Read from versions.json so the pinned version lives in exactly one place.
        # Override on the CLI for one-off local testing of a different tag, e.g.:
        #   docker compose build --build-arg OPENCLAW_VERSION=v2026.4.25
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-v2026.4.26}
    image: openclaw:${OPENCLAW_VERSION:-v2026.4.26}-local
    ports:
      - "18789:18789"
    environment:
      AXEL_TIER: ${AXEL_TIER:-starter}
      AXEL_USER_ID: ${AXEL_USER_ID:-local-user}
      AXEL_SESSION_ID: ${AXEL_SESSION_ID:-local-session}
      AXEL_SESSION_NAME: ${AXEL_SESSION_NAME:-local}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-dev-token-change-me}
    volumes:
      # Named volume so workspace state survives `docker compose down`.
      # Use `docker compose down -v` to wipe.
      - openclaw-workspace:/data/workspace
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/127.0.0.1/18789) >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  openclaw-workspace:
