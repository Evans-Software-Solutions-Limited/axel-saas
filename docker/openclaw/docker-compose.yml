services:
  openclaw:
    build:
      context: .
      args:
        # Read from versions.json so the pinned version lives in exactly one place.
        # Override on the CLI for one-off local testing of a different tag, e.g.:
        #   docker compose build --build-arg OPENCLAW_VERSION=v2026.4.25
        OPENCLAW_VERSION: ${OPENCLAW_VERSION:-v2026.4.26}
    image: openclaw:${OPENCLAW_VERSION:-v2026.4.26}-local
    ports:
      - "18789:18789"
    environment:
      AXEL_TIER: ${AXEL_TIER:-free}
      AXEL_USER_ID: ${AXEL_USER_ID:-local-user}
      AXEL_SESSION_ID: ${AXEL_SESSION_ID:-local-session}
      AXEL_SESSION_NAME: ${AXEL_SESSION_NAME:-local}
      # No default. Compose defaults like `dev-token-change-me` have a habit
      # of shipping to prod. Set this in your shell (`export
      # OPENCLAW_GATEWAY_TOKEN=$(uuidgen)`) before running. The entrypoint
      # validates that it is set; phase 5 ECS task overrides supply it from
      # secrets.
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    volumes:
      # Named volume so workspace state survives `docker compose down`.
      # Use `docker compose down -v` to wipe.
      - openclaw-workspace:/data/workspace
    # Healthcheck is defined in the Dockerfile (start_period=90s, bash-wrapped
    # so /dev/tcp works). Do NOT override here without keeping the `bash -c`
    # wrapper — `/bin/sh` in Debian slim is `dash`, which doesn't support
    # bash's /dev/tcp builtin and will make every probe exit 2.

volumes:
  openclaw-workspace:
